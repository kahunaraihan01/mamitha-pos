<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamitha Bakery - Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .admin-container { padding: 30px; max-width: 1200px; margin: 0 auto; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--brand-dark2); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 15px; }
    .stat-icon { width: 50px; height: 50px; border-radius: 12px; background: rgba(216,67,21,0.1); color: var(--brand-orange); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    .stat-value { font-size: 1.5rem; font-weight: 700; }
    .stat-label { color: rgba(255,255,255,0.5); font-size: .85rem; }
    
    .data-table { width: 100%; border-collapse: collapse; background: var(--brand-dark2); border-radius: 16px; overflow: hidden; }
    .data-table th, .data-table td { padding: 15px 20px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .data-table th { background: rgba(0,0,0,0.2); font-weight: 600; color: rgba(255,255,255,0.6); font-size: .9rem; text-transform: uppercase; letter-spacing: 1px; }
    .data-table tr:hover { background: rgba(255,255,255,0.02); }
    
    .menu-img-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
    .menu-emoji-thumb { width: 40px; height: 40px; border-radius: 8px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    
    .action-btn { background: none; border: none; color: rgba(255,255,255,0.5); font-size: 1.1rem; cursor: pointer; padding: 5px; transition: var(--transition); }
    .action-btn:hover { color: white; }
    .action-btn.delete:hover { color: var(--brand-red); }
  </style>
</head>
<body>

  <header class="pos-header">
    <div class="flex">
      <div class="pos-logo-mark" style="background:var(--brand-brown)"><i class="fa-solid fa-gear"></i></div>
      <div>
        <div class="pos-brand-name">Admin Dashboard</div>
        <div class="pos-brand-sub">Mamitha Bakery</div>
      </div>
    </div>
    <div class="flex gap-md">
      <a href="cashier.html" class="header-nav-btn"><i class="fa-solid fa-desktop"></i> Cashier</a>
    </div>
  </header>

  <div class="admin-container">
    <div class="stats-grid" id="statsGrid">
      <!-- Stats load here -->
    </div>

    <div class="flex" style="justify-content: space-between; margin-bottom: 20px;">
      <h2>Menu Management</h2>
      <button class="btn btn-primary" onclick="openMenuModal()"><i class="fa-solid fa-plus"></i> Add Menu Item</button>
    </div>

    <table class="data-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="menuTableBody">
        <!-- Menu load here -->
      </tbody>
    </table>
  </div>

  <!-- Menu Item Modal -->
  <div class="modal-overlay" id="menuModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeMenuModal()"><i class="fa-solid fa-xmark"></i></button>
      <h2 id="modalTitle">Add Menu Item</h2>
      <form id="menuForm" onsubmit="saveMenuItem(event)">
        <input type="hidden" id="itemId">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="itemName" class="form-input" required>
        </div>
        <div class="form-group">
          <label>Price (Rp)</label>
          <input type="number" id="itemPrice" class="form-input" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="itemCategory" class="form-input">
            <option value="Roti">Roti (Bread)</option>
            <option value="Kue">Kue (Cake)</option>
            <option value="Pastry">Pastry</option>
            <option value="Minuman">Minuman (Drinks)</option>
            <option value="Lainnya">Lainnya (Other)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Emoji Icon (used if no image)</label>
          <input type="text" id="itemEmoji" class="form-input" value="🍞" maxlength="2">
        </div>
        <div class="form-group">
          <label>Image Upload</label>
          <input type="file" id="itemImage" class="form-input" accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:20px;">Save Item</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = '/api';
    let menuItems = [];

    async function loadData() {
      try {
        // Fetch stats
        const statsRes = await fetch(`${API_URL}/stats`);
        const stats = await statsRes.json();
        
        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-money-bill-wave"></i></div>
            <div>
              <div class="stat-label">Today's Revenue</div>
              <div class="stat-value">Rp ${stats.todayRevenue.toLocaleString('id-ID')}</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-receipt"></i></div>
            <div>
              <div class="stat-label">Today's Orders</div>
              <div class="stat-value">${stats.todayOrders}</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:rgba(249,168,37,0.1); color:var(--brand-gold)"><i class="fa-solid fa-bell"></i></div>
            <div>
              <div class="stat-label">Pending Kitchen</div>
              <div class="stat-value">${stats.pendingOrders}</div>
            </div>
          </div>
        `;

        // Fetch menu
        const menuRes = await fetch(`${API_URL}/menu`);
        menuItems = await menuRes.json();
        renderMenuTable();
      } catch (e) {
        console.error(e);
      }
    }

    function renderMenuTable() {
      const tbody = document.getElementById('menuTableBody');
      tbody.innerHTML = '';
      
      menuItems.forEach(item => {
        const tr = document.createElement('tr');
        const media = item.image 
          ? `<img src="${item.image}" class="menu-img-thumb">`
          : `<div class="menu-emoji-thumb">${item.emoji}</div>`;
          
        tr.innerHTML = `
          <td>${media}</td>
          <td style="font-weight:600">${item.name}</td>
          <td><span class="badge" style="background:rgba(255,255,255,0.1)">${item.category}</span></td>
          <td class="price-tag">Rp ${item.price.toLocaleString('id-ID')}</td>
          <td>
            <button class="action-btn" onclick='editItem(${JSON.stringify(item)})'><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn delete" onclick="deleteItem('${item.id}')"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openMenuModal(item = null) {
      document.getElementById('menuForm').reset();
      document.getElementById('itemId').value = '';
      document.getElementById('modalTitle').innerText = 'Add Menu Item';
      
      if (item) {
        document.getElementById('modalTitle').innerText = 'Edit Menu Item';
        document.getElementById('itemId').value = item.id;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemPrice').value = item.price;
        document.getElementById('itemCategory').value = item.category;
        document.getElementById('itemEmoji').value = item.emoji;
      }
      
      document.getElementById('menuModal').classList.add('active');
    }

    function closeMenuModal() {
      document.getElementById('menuModal').classList.remove('active');
    }

    function editItem(item) {
      openMenuModal(item);
    }

    async function saveMenuItem(e) {
      e.preventDefault();
      const id = document.getElementById('itemId').value;
      const formData = new FormData();
      formData.append('name', document.getElementById('itemName').value);
      formData.append('price', document.getElementById('itemPrice').value);
      formData.append('category', document.getElementById('itemCategory').value);
      formData.append('emoji', document.getElementById('itemEmoji').value);
      
      const imgFile = document.getElementById('itemImage').files[0];
      if (imgFile) formData.append('image', imgFile);

      try {
        const url = id ? `${API_URL}/menu/${id}` : `${API_URL}/menu`;
        const method = id ? 'PUT' : 'POST';
        
        await fetch(url, { method, body: formData });
        closeMenuModal();
        loadData();
      } catch (err) {
        console.error(err);
        alert('Failed to save item');
      }
    }

    async function deleteItem(id) {
      if (!confirm('Are you sure you want to delete this item?')) return;
      try {
        await fetch(`${API_URL}/menu/${id}`, { method: 'DELETE' });
        loadData();
      } catch (err) {
        console.error(err);
      }
    }

    loadData();
  </script>
</body>
</html>
